<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>portfolio - mohammed / contact</title>
  <link rel="stylesheet" href="assets/styling/main.css">
  <link rel="stylesheet" href="assets/styling/responsive.css">
</head>
<body>
  <!-- Header -->
  <header id="home-header" class="flex">
    <div id="logo" data-lang="logo">
      <span>Qavento</span>
    </div>
    <div class="flex" id="Navdiv">
    <menu id="menu" class="flex">
      <span></span>
      <span></span>
    </menu>
    <nav id="navbar">
    </nav>
    </div>
  </header>
     <section id="contact">
      <!-- نموذج التواصل مجهز للربط بالـ Server -->
      <form id="contact-form">
        <h2>Get In Touch</h2>
        
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your Name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your Email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Your Message" required></textarea>

        <button type="submit" id="submit-btn">Send Message</button>
        <p id="form-status" style="margin-top: 10px; text-align: center; font-size: 14px;"></p>
      </form>
    </section>
    <footer id="tail" class="flex">
    <span>Made with 🤍 mohammed khale</span>
  </footer>
  <script src="assets/apps/app.js"></script>
</body>
</html>
